services:
  smartapi:
    image: ${SMARTAPI_IMAGE:-bighulk/smartapi:1.0.1}
    # Preserve the layout of existing source-built installations.
    command: ["-data-dir", "/data", "-config", "/etc/smartapi/config.yaml"]
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:17910:7900"
      - "127.0.0.1:17810:7890"
    volumes:
      - smartapi-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  smartapi-data:
