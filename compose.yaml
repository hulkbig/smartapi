# Download this file, then run: docker compose up -d --no-build
name: smartapi
services:
  smartapi:
    image: ${SMARTAPI_IMAGE:-bighulk/smartapi:1.0.1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:17910:7900"
      - "127.0.0.1:17810:7890"
    volumes:
      - smartapi-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  smartapi-data:
    name: ${SMARTAPI_DATA_VOLUME:-smartapi-data}
